name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clean pip install and test
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -c "import mcp; import mcp.server.fastmcp"
          python -m pytest -q

  test-uv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install -U uv
      - name: uv sync and test
        run: |
          uv sync --extra dev
          uv run --extra dev python -c "import mcp; import mcp.server.fastmcp"
          uv run --extra dev pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and health-check container
        run: |
          docker build -t holodeck:ci .
          cid="$(docker run -d -p 127.0.0.1:9876:8787 -v holodeck-ci-data:/data holodeck:ci)"
          trap 'docker rm -f "$cid"' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9876/health; then
              exit 0
            fi
            sleep 1
          done
          echo "container health check failed" >&2
          exit 1
