[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holodeck-runtime"
version = "0.1.0"
description = "Local-first control plane for bounded autonomous development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
holodeck = "holodeck_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
