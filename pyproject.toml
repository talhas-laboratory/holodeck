[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "holodeck-control-plane"
version = "0.1.0"
description = "Local-first control plane for bounded autonomous development."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
keywords = ["agents", "coordination", "local-first", "sqlite"]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]

[project.urls]
Homepage = "https://github.com/talhas-laboratory/holodeck"
Repository = "https://github.com/talhas-laboratory/holodeck"
Source = "https://github.com/talhas-laboratory/holodeck"
Issues = "https://github.com/talhas-laboratory/holodeck/issues"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8"]

[project.scripts]
holodeck = "holodeck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
holodeck = ["frontend/*"]
