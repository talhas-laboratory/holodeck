services:
  holodeck:
    build: .
    ports:
      - "127.0.0.1:${HOLODECK_PORT:-8787}:8787"
    volumes:
      - holodeck-data:/data
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8787/health').status == 200"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s

volumes:
  holodeck-data:
